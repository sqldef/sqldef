# yaml-language-server: $schema=../../testutil/testcase.schema.json

# Tests for quote-aware mode (legacy_ignore_quotes: false) in MSSQL

ForeignKeyDependencyOrderingCaseMismatch:
  # MSSQL treats Users and users as the same table (case-insensitive).
  # Dependency ordering should correctly recognize this and create
  # users first, then orders.
  legacy_ignore_quotes: false
  desired: |
    CREATE TABLE orders (
      id int PRIMARY KEY,
      user_id int,
      CONSTRAINT fk_user FOREIGN KEY (user_id) REFERENCES Users (id)
    );
    CREATE TABLE users (id int PRIMARY KEY);
  up: |
    CREATE TABLE users (id int PRIMARY KEY);
    CREATE TABLE orders (
      id int PRIMARY KEY,
      user_id int,
      CONSTRAINT fk_user FOREIGN KEY (user_id) REFERENCES Users (id)
    );
  down: |
    DROP TABLE dbo.orders;
    DROP TABLE dbo.users;
AddColumnCaseMismatch:
  # Current has USERS, desired has users - should recognize as same table
  legacy_ignore_quotes: false
  current: |
    CREATE TABLE USERS (id int PRIMARY KEY);
  desired: |
    CREATE TABLE users (id int PRIMARY KEY, name varchar(100));
  up: |
    ALTER TABLE dbo.users ADD name varchar(100);
  down: |
    ALTER TABLE dbo.USERS DROP COLUMN [name];
DropColumnCaseMismatch:
  # Current has Users, desired has USERS - should recognize as same table
  legacy_ignore_quotes: false
  current: |
    CREATE TABLE Users (id int PRIMARY KEY, old_col varchar(50));
  desired: |
    CREATE TABLE USERS (id int PRIMARY KEY);
  up: |
    ALTER TABLE dbo.USERS DROP COLUMN [old_col];
  down: |
    ALTER TABLE dbo.Users ADD old_col varchar(50);

DropColumnBracketedIdentifier:
  legacy_ignore_quotes: false
  current: |
    CREATE TABLE USERS (id int PRIMARY KEY, [old_col] varchar(50));
  desired: |
    CREATE TABLE USERS (id int PRIMARY KEY);
  up: |
    ALTER TABLE dbo.USERS DROP COLUMN [old_col];
  down: |
    ALTER TABLE dbo.USERS ADD [old_col] varchar(50);

AddColumnBracketedIdentifier:
  legacy_ignore_quotes: false
  current: |
    CREATE TABLE users (id int PRIMARY KEY);
  desired: |
    CREATE TABLE users (id int PRIMARY KEY, [name] varchar(100));
  up: |
    ALTER TABLE dbo.users ADD [name] varchar(100);
  down: |
    ALTER TABLE dbo.users DROP COLUMN [name];

CreateWithNonReservedKeywordColumns:
  legacy_ignore_quotes: false
  desired: |
    CREATE TABLE users (
      id int PRIMARY KEY,
      newid int,
      newsequentialid int,
      getutcdate int,
      sysutcdatetime int,
      try_cast int,
      openjson int,
      string_split int,
      apply int,
      columnstore int,
      pad_index int,
      ignore_dup_key int,
      statistics_norecompute int,
      statistics_incremental int,
      allow_row_locks int,
      allow_page_locks int
    );
    CREATE INDEX idx_newid ON users (newid, newsequentialid, getutcdate, sysutcdatetime, try_cast, openjson, string_split, apply, columnstore, pad_index, ignore_dup_key, statistics_norecompute, statistics_incremental, allow_row_locks, allow_page_locks);
  up: |
    CREATE TABLE users (
      id int PRIMARY KEY,
      newid int,
      newsequentialid int,
      getutcdate int,
      sysutcdatetime int,
      try_cast int,
      openjson int,
      string_split int,
      apply int,
      columnstore int,
      pad_index int,
      ignore_dup_key int,
      statistics_norecompute int,
      statistics_incremental int,
      allow_row_locks int,
      allow_page_locks int
    );
    CREATE INDEX idx_newid ON users (newid, newsequentialid, getutcdate, sysutcdatetime, try_cast, openjson, string_split, apply, columnstore, pad_index, ignore_dup_key, statistics_norecompute, statistics_incremental, allow_row_locks, allow_page_locks);
  down: |
    DROP TABLE dbo.users;
