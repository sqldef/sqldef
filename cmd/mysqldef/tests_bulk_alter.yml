# yaml-language-server: $schema=../../testutil/testcase.schema.json

# These cases exercise bulk_alter: a table's add/change ALTERs and its later
# drop ALTERs are fused into one `ALTER TABLE t a1, a2, ...` statement.
#
# TiDB note: bundles that contain `ADD COLUMN ... AFTER <col-added-in-the
# -same-ALTER>` fail on TiDB because it cannot resolve the just-added column
# in subsequent subcommands of the same statement (MySQL processes the
# subcommands sequentially and accepts this). Tests that emit such a bundle
# are marked `flavor: !tidb`.
# Ref. https://docs.pingcap.com/tidb/stable/sql-statement-alter-table/

BulkAlterAddDropColumns:
  legacy_ignore_quotes: false
  flavor: "!tidb"
  config:
    bulk_alter: true
  current: |
    CREATE TABLE patients (
      id bigint NOT NULL,
      c int
    );
  desired: |
    CREATE TABLE patients (
      id bigint NOT NULL,
      a int,
      b int
    );
  up: |
    ALTER TABLE patients ADD COLUMN a int AFTER id, ADD COLUMN b int AFTER a, DROP COLUMN `c`;
  down: |
    ALTER TABLE patients ADD COLUMN c int AFTER id, DROP COLUMN `b`, DROP COLUMN `a`;

BulkAlterDisabledByDefault:
  legacy_ignore_quotes: false
  current: |
    CREATE TABLE patients (
      id bigint NOT NULL,
      c int
    );
  desired: |
    CREATE TABLE patients (
      id bigint NOT NULL,
      a int,
      b int
    );
  up: |
    ALTER TABLE patients ADD COLUMN a int AFTER id;
    ALTER TABLE patients ADD COLUMN b int AFTER a;
    ALTER TABLE patients DROP COLUMN `c`;
  down: |
    ALTER TABLE patients ADD COLUMN c int AFTER id;
    ALTER TABLE patients DROP COLUMN `b`;
    ALTER TABLE patients DROP COLUMN `a`;

BulkAlterQuotedTableNames:
  flavor: "!tidb"
  config:
    bulk_alter: true
  current: |
    CREATE TABLE patients (
      id bigint NOT NULL,
      c int
    );
  desired: |
    CREATE TABLE patients (
      id bigint NOT NULL,
      a int,
      b int
    );
  up: |
    ALTER TABLE `patients` ADD COLUMN `a` int AFTER `id`, ADD COLUMN `b` int AFTER `a`, DROP COLUMN `c`;
  down: |
    ALTER TABLE `patients` ADD COLUMN `c` int AFTER `id`, DROP COLUMN `b`, DROP COLUMN `a`;

BulkAlterPerTableScope:
  legacy_ignore_quotes: false
  flavor: "!tidb"
  config:
    bulk_alter: true
  current: |
    CREATE TABLE a (
      id bigint NOT NULL
    );
    CREATE TABLE b (
      id bigint NOT NULL
    );
  desired: |
    CREATE TABLE a (
      id bigint NOT NULL,
      x int,
      y int
    );
    CREATE TABLE b (
      id bigint NOT NULL,
      x int,
      y int
    );
  up: |
    ALTER TABLE a ADD COLUMN x int AFTER id, ADD COLUMN y int AFTER x;
    ALTER TABLE b ADD COLUMN x int AFTER id, ADD COLUMN y int AFTER x;
  down: |
    ALTER TABLE a DROP COLUMN `y`, DROP COLUMN `x`;
    ALTER TABLE b DROP COLUMN `y`, DROP COLUMN `x`;

BulkAlterDropColumnSkipped:
  legacy_ignore_quotes: false
  enable_drop: false
  config:
    bulk_alter: true
  current: |
    CREATE TABLE patients (
      id bigint NOT NULL,
      c int
    );
  desired: |
    CREATE TABLE patients (
      id bigint NOT NULL,
      a int
    );
  up: |
    ALTER TABLE patients ADD COLUMN a int AFTER id;
    -- Skipped: ALTER TABLE patients DROP COLUMN `c`;
  down: |
    -- Skipped: ALTER TABLE patients DROP COLUMN `a`;

# The identifiers are quoted here because the cleanup DROP INDEX carries the
# current table's name, which always comes quoted from the database: an unquoted
# desired name would not match the bundle's ALTER TABLE prefix, and the
# statement would never be fused in the first place.
BulkAlterDropIndexSkipped:
  legacy_ignore_quotes: false
  enable_drop: false
  config:
    bulk_alter: true
  current: |
    CREATE TABLE `patients` (
      `id` bigint NOT NULL,
      `b` int,
      KEY `b_idx` (`b`)
    );
  desired: |
    CREATE TABLE `patients` (
      `id` bigint NOT NULL,
      `b` int,
      `a` int
    );
  up: |
    ALTER TABLE `patients` ADD COLUMN `a` int AFTER `b`;
    -- Skipped: ALTER TABLE `patients` DROP INDEX `b_idx`;
  down: |
    -- Skipped: ALTER TABLE `patients` DROP COLUMN `a`;

BulkAlterDropForeignKeyDropColumnSkipped:
  legacy_ignore_quotes: false
  enable_drop: false
  config:
    bulk_alter: true
  current: |
    CREATE TABLE owners (
      id bigint NOT NULL PRIMARY KEY
    );
    CREATE TABLE pets (
      id bigint NOT NULL PRIMARY KEY,
      owner_id bigint,
      c int,
      CONSTRAINT pets_owner_fk FOREIGN KEY (owner_id) REFERENCES owners (id)
    );
  desired: |
    CREATE TABLE owners (
      id bigint NOT NULL PRIMARY KEY
    );
    CREATE TABLE pets (
      id bigint NOT NULL PRIMARY KEY,
      owner_id bigint,
      KEY pets_owner_fk (owner_id)
    );
  up: |
    ALTER TABLE pets DROP FOREIGN KEY `pets_owner_fk`;
    -- Skipped: ALTER TABLE pets DROP COLUMN `c`;
  down: |
    ALTER TABLE pets ADD CONSTRAINT pets_owner_fk FOREIGN KEY (owner_id) REFERENCES owners (id);

BulkAlterAddIndexDropColumnSkipped:
  legacy_ignore_quotes: false
  enable_drop: false
  flavor: "!tidb"
  config:
    bulk_alter: true
  current: |
    CREATE TABLE patients (
      id bigint NOT NULL,
      c int
    );
  desired: |
    CREATE TABLE patients (
      id bigint NOT NULL,
      a int,
      KEY a_idx (a)
    );
  up: |
    ALTER TABLE patients ADD COLUMN a int AFTER id, ADD KEY a_idx (a);
    -- Skipped: ALTER TABLE patients DROP COLUMN `c`;
  down: |
    -- Skipped: ALTER TABLE `patients` DROP INDEX `a_idx`;
    -- Skipped: ALTER TABLE patients DROP COLUMN `a`;
