# yaml-language-server: $schema=../../testutil/testcase.schema.json
# Tests for enable_drop: false behavior (DROP statements are commented out)
# The enable_drop: true behavior is tested in other test files.

DropTableSkipped:
  enable_drop: false
  current: |
    CREATE TABLE users (id bigint NOT NULL);
  desired: ""
  up: |
    -- Skipped: DROP TABLE `users`;
  down: ""

DropViewSkipped:
  enable_drop: false
  current: |
    CREATE TABLE users (id bigint NOT NULL, name varchar(100));
    CREATE VIEW users_view AS SELECT id, name FROM users;
  desired: |
    CREATE TABLE users (id bigint NOT NULL, name varchar(100));
  up: |
    -- Skipped: DROP VIEW `users_view`;
  down: ""

DropColumnSkipped:
  enable_drop: false
  current: |
    CREATE TABLE users (
      id bigint NOT NULL,
      name varchar(100)
    );
  desired: |
    CREATE TABLE users (
      id bigint NOT NULL
    );
  up: |
    -- Skipped: ALTER TABLE `users` DROP COLUMN `name`;
  down: ""

DropIndexSkipped:
  enable_drop: false
  current: |
    CREATE TABLE users (
      id bigint NOT NULL,
      email varchar(255),
      INDEX idx_email (email)
    );
  desired: |
    CREATE TABLE users (
      id bigint NOT NULL,
      email varchar(255)
    );
  up: |
    -- Skipped: ALTER TABLE `users` DROP INDEX `idx_email`;
  down: ""

AddColumnWithCommentSpellingDropColumnNotSkipped:
  enable_drop: false
  legacy_ignore_quotes: false
  current: |
    CREATE TABLE users (
      id bigint NOT NULL
    );
  desired: |
    CREATE TABLE users (
      id bigint NOT NULL,
      a int COMMENT 'set before DROP COLUMN runs',
      b int
    );
  up: |
    ALTER TABLE users ADD COLUMN a int COMMENT 'set before DROP COLUMN runs' AFTER id;
    ALTER TABLE users ADD COLUMN b int AFTER a;
  down: |
    -- Skipped: ALTER TABLE users DROP COLUMN `b`;
    -- Skipped: ALTER TABLE users DROP COLUMN `a`;
