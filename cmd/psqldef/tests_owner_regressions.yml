OwnerDependentViewRecreationPreservesOwnersAndMetadata:
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: readonly_user
        drop: true
  current: |
    CREATE TABLE users (id BIGINT PRIMARY KEY, name TEXT);
    CREATE VIEW v_base AS SELECT id, name FROM users;
    CREATE VIEW v_dep AS SELECT id FROM v_base;
    CREATE VIEW v_leaf AS SELECT id FROM v_dep;
    ALTER VIEW v_base OWNER TO app_user;
    ALTER VIEW v_dep OWNER TO app_user;
    ALTER VIEW v_leaf OWNER TO app_user;
    COMMENT ON VIEW v_dep IS 'dependent';
    GRANT SELECT ON v_leaf TO readonly_user;
  desired: |
    CREATE TABLE users (id BIGINT PRIMARY KEY, name TEXT);
    CREATE VIEW v_base AS SELECT id FROM users;
    CREATE VIEW v_dep AS SELECT id FROM v_base;
    CREATE VIEW v_leaf AS SELECT id FROM v_dep;
    COMMENT ON VIEW v_dep IS 'dependent';
    GRANT SELECT ON v_leaf TO readonly_user;
  up: |
    DROP VIEW public.v_leaf;
    DROP VIEW public.v_dep;
    DROP VIEW public.v_base;
    CREATE VIEW public.v_base AS select id from users;
    ALTER VIEW public.v_base OWNER TO "app_user";
    CREATE VIEW public.v_dep AS select id from v_base;
    ALTER VIEW public.v_dep OWNER TO "app_user";
    CREATE VIEW public.v_leaf AS select id from v_dep;
    ALTER VIEW public.v_leaf OWNER TO "app_user";
    COMMENT ON VIEW public.v_dep IS 'dependent';
    GRANT SELECT ON TABLE public.v_leaf TO "readonly_user";
  down: |
    CREATE OR REPLACE VIEW public.v_base AS select id, name from users;

