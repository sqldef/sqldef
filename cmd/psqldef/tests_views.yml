DependentMatviewWithDataRecreation:
  legacy_ignore_quotes: false
  current: |
    CREATE TABLE users (id BIGINT PRIMARY KEY, name TEXT);
    CREATE VIEW v_base AS SELECT id, name FROM users;
    CREATE MATERIALIZED VIEW mv_dep AS SELECT id FROM v_base WITH DATA;
  desired: |
    CREATE TABLE users (id BIGINT PRIMARY KEY, name TEXT);
    CREATE VIEW v_base AS SELECT id FROM users;
    CREATE MATERIALIZED VIEW mv_dep AS SELECT id FROM v_base WITH DATA;
  up: |
    DROP MATERIALIZED VIEW public.mv_dep;
    DROP VIEW public.v_base;
    CREATE VIEW v_base AS SELECT id FROM users;
    CREATE MATERIALIZED VIEW mv_dep AS SELECT id FROM v_base WITH DATA;
  down: |
    CREATE OR REPLACE VIEW v_base AS SELECT id, name FROM users;

ViewDDLsAreEmittedLastWithoutChangingDefinition:
  current: |
    CREATE TABLE foos (
      id bigint PRIMARY KEY
    );
  desired: |
    CREATE VIEW foos_view AS SELECT id, secret FROM foos WHERE secret = false;
    CREATE TABLE foos (
      id bigint PRIMARY KEY,
      secret boolean NOT NULL DEFAULT false
    );
  up: |
    ALTER TABLE "public"."foos" ADD COLUMN "secret" boolean NOT NULL DEFAULT false;
    CREATE VIEW foos_view AS SELECT id, secret FROM foos WHERE secret = false;
  down: |
    DROP VIEW "public"."foos_view";
    ALTER TABLE "public"."foos" DROP COLUMN "secret";
ViewDDLsAreEmittedLastWithChangingDefinition:
  current: |
    CREATE TABLE foos (
      id bigint PRIMARY KEY
    );
    CREATE VIEW foos_view AS SELECT 1 AS dummy;
  desired: |
    CREATE VIEW foos_view AS
      SELECT id, secret FROM foos WHERE secret = false;
    CREATE TABLE foos (
      id bigint PRIMARY KEY,
      secret boolean NOT NULL DEFAULT false
    );
  up: |
    ALTER TABLE "public"."foos" ADD COLUMN "secret" boolean NOT NULL DEFAULT false;
    DROP VIEW "public"."foos_view";
    CREATE VIEW "public"."foos_view" AS
      SELECT id, secret FROM foos WHERE secret = false;
  down: |
    DROP VIEW "public"."foos_view";
    CREATE VIEW "public"."foos_view" AS SELECT 1 AS dummy;
    ALTER TABLE "public"."foos" DROP COLUMN "secret";
