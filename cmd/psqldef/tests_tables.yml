    CREATE POLICY p ON t FOR SELECT USING (n::varchar(3) = 'x');
    CREATE INDEX i1 ON t ((name::varchar(10)));
    CREATE INDEX i2 ON t (id) WHERE n::varchar(3) = 'abc';
