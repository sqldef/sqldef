    ALTER TABLE public.t DROP CONSTRAINT c2;
    ALTER TABLE public.t ADD CONSTRAINT c1 CHECK (name::character varying(3) <> 'abc');
    ALTER TABLE public.t ADD CONSTRAINT c2 CHECK (n::character varying(3) <> 'abc');
    DROP POLICY p ON public.t;
    CREATE POLICY p ON t FOR SELECT USING (n::varchar(3) = 'x');
    CREATE OR REPLACE VIEW v AS SELECT id FROM t WHERE n::varchar(3) = 'abc';
    DROP INDEX public.i1;
    CREATE INDEX i1 ON public.t ((name::varchar(10)));
    DROP INDEX public.i2;
    CREATE INDEX i2 ON public.t (id) WHERE n::varchar(3) = 'abc';
  down: |
    ALTER TABLE public.t DROP CONSTRAINT c1;
    ALTER TABLE public.t DROP CONSTRAINT c2;
    ALTER TABLE public.t ADD CONSTRAINT c1 CHECK (name <> 'abc');
    ALTER TABLE public.t ADD CONSTRAINT c2 CHECK (n <> 'abc');
    DROP POLICY p ON public.t;
    CREATE POLICY p ON t FOR SELECT USING (n = 'x');
    CREATE OR REPLACE VIEW v AS SELECT id FROM t WHERE n = 'abc';
    DROP INDEX public.i1;
    CREATE INDEX i1 ON public.t ((name::varchar(5)));
    DROP INDEX public.i2;
    CREATE INDEX i2 ON public.t (id) WHERE n = 'abc';

