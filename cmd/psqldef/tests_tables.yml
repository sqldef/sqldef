# yaml-language-server: $schema=../../testutil/testcase.schema.json
CreateTableWithExtensionColumn:
  # EXTENSION is non-reserved in PostgreSQL, so it is valid as a column name.
  # https://www.postgresql.org/docs/current/sql-keywords-appendix.html
  desired: |
    CREATE TABLE t (
      extension text
    );

CreateTableWithStatementColumn:
  # STATEMENT is non-reserved in PostgreSQL, so it is valid as a column name.
  # https://www.postgresql.org/docs/current/sql-keywords-appendix.html
  legacy_ignore_quotes: false
  desired: |
    CREATE TABLE t (
      statement text
    );

CreateTableWithModeColumn:
  # MODE is non-reserved in PostgreSQL, so it is valid as a column name.
  # https://www.postgresql.org/docs/current/sql-keywords-appendix.html
  legacy_ignore_quotes: false
  desired: |
    CREATE TABLE t (
      mode text
    );

