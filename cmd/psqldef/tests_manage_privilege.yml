      id BIGINT PRIMARY KEY,
      secret TEXT
    );
    GRANT SELECT ON TABLE new_logs TO app_user;
    GRANT INSERT (secret) ON TABLE new_logs TO readonly_user;
  up: |
    ALTER TABLE public.old_logs RENAME TO new_logs;
    REVOKE UPDATE ON TABLE public.new_logs FROM "app_user";
  down: |
    CREATE TABLE old_logs (
      id BIGINT PRIMARY KEY,
      secret TEXT
    );
    GRANT SELECT, UPDATE ON TABLE public.old_logs TO "app_user";
    GRANT INSERT (secret) ON TABLE public.old_logs TO "readonly_user";
    DROP TABLE public.new_logs;

ManagePrivilegeRenameTableAndRecreateOldName:
  # The privileges belong to the renamed table, not to the name: a new table
  # taking over the old name starts without them.
  legacy_ignore_quotes: false
  manage:
