# yaml-language-server: $schema=../../testutil/testcase.schema.json
# Tests for manage.privilege (see object-management.md): which grantees'
# privileges are managed, and whether REVOKE is allowed per rule.

ManagePrivilegeBasicGrant:
  manage:
    privilege:
      - target: readonly_user
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT ON TABLE users TO readonly_user;
  up: |
    GRANT SELECT ON TABLE "public"."users" TO "readonly_user";
  down: |
    REVOKE SELECT ON TABLE "public"."users" FROM "readonly_user";

ManagePrivilegeUnmatchedGranteeUntouched:
  # app_user matches no rule: its desired grant is ignored and its existing
  # drifted grant is left alone.
  manage:
    privilege:
      - target: readonly_user
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT INSERT ON TABLE users TO app_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT ON TABLE users TO readonly_user;
    GRANT UPDATE ON TABLE users TO app_user;
  up: |
    GRANT SELECT ON TABLE "public"."users" TO "readonly_user";
  down: |
    REVOKE SELECT ON TABLE "public"."users" FROM "readonly_user";

ManagePrivilegeRevokeAllowedDespiteEnableDropFalse:
  # The keystone: rule-level drop permits REVOKE even though the global
  # enable_drop is false (which still blocks object drops).
  enable_drop: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT, INSERT ON TABLE users TO app_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT ON TABLE users TO app_user;
  up: |
    REVOKE INSERT ON TABLE "public"."users" FROM "app_user";
  down: |
    GRANT INSERT ON TABLE "public"."users" TO "app_user";

ManagePrivilegeRevokeForbiddenByRule:
  # drop defaults to false: the drifted grant stays, the revoke is skipped
  # even though enable_drop is true.
  manage:
    privilege:
      - target: readonly_user
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT, INSERT ON TABLE users TO readonly_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT ON TABLE users TO readonly_user;
  up: |
    -- Skipped: REVOKE INSERT ON TABLE "public"."users" FROM "readonly_user";
  down: ""

ManagePrivilegeOrphanRevokeAllowed:
  # Grantee absent from desired entirely: orphan path, revoke allowed by rule.
  enable_drop: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT ON TABLE users TO app_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
  up: |
    REVOKE SELECT ON TABLE "public"."users" FROM "app_user";
  down: |
    GRANT SELECT ON TABLE "public"."users" TO "app_user";

ManagePrivilegeRegexpTargetFirstMatchWins:
  # user\d matches user1..user4 with drop, catch-all forbids drop for others.
  enable_drop: false
  manage:
    privilege:
      - target: 'user\d'
        drop: true
      - target: '.*'
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT ON TABLE users TO user1;
    GRANT SELECT ON TABLE users TO readonly_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
  up: |
    -- Skipped: REVOKE SELECT ON TABLE "public"."users" FROM "readonly_user";
    REVOKE SELECT ON TABLE "public"."users" FROM "user1";
  down: |
    GRANT SELECT ON TABLE "public"."users" TO "user1";

ManagePrivilegeSequenceAndColumn:
  # Sequence and column grants work under manage.privilege, including revokes.
  enable_drop: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE counters (
      id BIGINT PRIMARY KEY,
      n SERIAL,
      f_secret VARCHAR(100)
    );
    GRANT USAGE, SELECT ON SEQUENCE counters_n_seq TO app_user;
    GRANT SELECT (id, f_secret) ON TABLE counters TO app_user;
  desired: |
    CREATE TABLE counters (
      id BIGINT PRIMARY KEY,
      n SERIAL,
      f_secret VARCHAR(100)
    );
    GRANT USAGE ON SEQUENCE counters_n_seq TO app_user;
    GRANT SELECT (id) ON TABLE counters TO app_user;
  up: |
    REVOKE SELECT ON SEQUENCE "public"."counters_n_seq" FROM "app_user";
    REVOKE SELECT (f_secret, id) ON TABLE "public"."counters" FROM "app_user";
    GRANT SELECT (id) ON TABLE "public"."counters" TO "app_user";
  down: |
    GRANT SELECT ON SEQUENCE "public"."counters_n_seq" TO "app_user";
    REVOKE SELECT (id) ON TABLE "public"."counters" FROM "app_user";
    GRANT SELECT (f_secret, id) ON TABLE "public"."counters" TO "app_user";

ManagePrivilegeIdempotent:
  manage:
    privilege:
      - target: readonly_user
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT ON TABLE users TO readonly_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT ON TABLE users TO readonly_user;
  up: ""
  down: ""

ManagePrivilegeSplitGrantStatementsRevokeOnce:
  # Privileges for the same (table, grantee) split across several desired GRANT
  # statements must be diffed as one unit: the REVOKE is emitted once, not once
  # per source statement.
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE users TO app_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT ON TABLE users TO app_user;
    GRANT INSERT ON TABLE users TO app_user;
  up: |
    REVOKE DELETE, UPDATE ON TABLE "public"."users" FROM "app_user";
  down: |
    GRANT UPDATE, DELETE ON TABLE "public"."users" TO "app_user";

ManagePrivilegeSplitGrantStatementsGrantOnce:
  # The GRANT side must also be diffed as one unit: a privilege missing from the
  # current schema is granted once even when the desired GRANTs are split.
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT ON TABLE users TO app_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT ON TABLE users TO app_user;
    GRANT INSERT ON TABLE users TO app_user;
  up: |
    GRANT INSERT ON TABLE "public"."users" TO "app_user";
  down: |
    REVOKE INSERT ON TABLE "public"."users" FROM "app_user";

ManagePrivilegeSplitGrantStatementsReorderedGrantees:
  # Grantee lists written in a different order (TO a, b vs TO b, a) target the
  # same grantees and must aggregate together, so the diff is emitted once per
  # grantee rather than once per source statement.
  manage:
    privilege:
      - target: 'app_user|readonly_user'
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE users TO app_user, readonly_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    GRANT SELECT ON TABLE users TO app_user, readonly_user;
    GRANT INSERT ON TABLE users TO readonly_user, app_user;
  up: |
    REVOKE DELETE, UPDATE ON TABLE "public"."users" FROM "app_user";
    REVOKE DELETE, UPDATE ON TABLE "public"."users" FROM "readonly_user";
  down: |
    GRANT UPDATE, DELETE ON TABLE "public"."users" TO "app_user", "readonly_user";

ManagePrivilegeOverlappingGranteeListsRevokeOnce:
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: 'app_user|readonly_user'
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE users TO app_user, readonly_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE users TO app_user, readonly_user;
    GRANT INSERT ON TABLE users TO app_user;
  up: |
    REVOKE DELETE, UPDATE ON TABLE public.users FROM "app_user";
    REVOKE DELETE, INSERT, UPDATE ON TABLE public.users FROM "readonly_user";
  down: |
    GRANT INSERT, UPDATE, DELETE ON TABLE public.users TO "readonly_user";
    GRANT UPDATE, DELETE ON TABLE public.users TO "app_user";

ManagePrivilegeOverlappingGranteeListsGrantOnce:
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: 'app_user|readonly_user'
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE users TO app_user, readonly_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT ON TABLE users TO app_user, readonly_user;
    GRANT INSERT ON TABLE users TO app_user;
  up: |
    GRANT INSERT ON TABLE public.users TO "app_user", "readonly_user";
  down: |
    REVOKE INSERT ON TABLE public.users FROM "app_user";
    REVOKE INSERT ON TABLE public.users FROM "readonly_user";

ManagePrivilegeOverlappingGranteeListsGrantOptionOnce:
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: 'app_user|readonly_user'
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE users TO app_user, readonly_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE users TO app_user, readonly_user WITH GRANT OPTION;
    GRANT SELECT ON TABLE users TO app_user WITH GRANT OPTION;
  up: |
    GRANT SELECT ON TABLE public.users TO "app_user", "readonly_user" WITH GRANT OPTION;
  down: |
    REVOKE GRANT OPTION FOR SELECT ON TABLE public.users FROM "app_user";
    REVOKE GRANT OPTION FOR SELECT ON TABLE public.users FROM "readonly_user";

ManagePrivilegeMixedGrantOptionRevokeOnce:
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE users TO app_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE users TO app_user WITH GRANT OPTION;
    GRANT INSERT ON TABLE users TO app_user;
  up: |
    REVOKE DELETE, UPDATE ON TABLE public.users FROM "app_user";
    GRANT SELECT ON TABLE public.users TO "app_user" WITH GRANT OPTION;
  down: |
    REVOKE GRANT OPTION FOR SELECT ON TABLE public.users FROM "app_user";
    GRANT UPDATE, DELETE ON TABLE public.users TO "app_user";

ManagePrivilegeMixedGrantOptionUpgrade:
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT ON TABLE users TO app_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT ON TABLE users TO app_user;
    GRANT SELECT ON TABLE users TO app_user WITH GRANT OPTION;
  up: |
    GRANT SELECT ON TABLE public.users TO "app_user" WITH GRANT OPTION;
  down: |
    REVOKE GRANT OPTION FOR SELECT ON TABLE public.users FROM "app_user";

ManagePrivilegeMixedGrantOptionFromNoPrivilege:
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE users TO app_user;
    GRANT SELECT ON TABLE users TO app_user WITH GRANT OPTION;
  up: |
    GRANT SELECT ON TABLE public.users TO "app_user" WITH GRANT OPTION;
  down: |
    REVOKE SELECT ON TABLE public.users FROM "app_user";

ManagePrivilegeMixedGrantOptionOverlappingGrantees:
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: 'app_user|readonly_user'
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE users TO app_user WITH GRANT OPTION;
    GRANT SELECT ON TABLE users TO readonly_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT ON TABLE users TO app_user, readonly_user;
    GRANT SELECT ON TABLE users TO app_user WITH GRANT OPTION;
  up: |
    GRANT INSERT ON TABLE public.users TO "app_user", "readonly_user";
  down: |
    REVOKE INSERT ON TABLE public.users FROM "app_user";
    REVOKE INSERT ON TABLE public.users FROM "readonly_user";

ManagePrivilegeMixedGrantOptionDowngradeOtherPrivilege:
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT ON TABLE users TO app_user WITH GRANT OPTION;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT ON TABLE users TO app_user;
    GRANT SELECT ON TABLE users TO app_user WITH GRANT OPTION;
  up: |
    REVOKE GRANT OPTION FOR INSERT ON TABLE public.users FROM "app_user";
  down: |
    GRANT INSERT ON TABLE public.users TO "app_user" WITH GRANT OPTION;

ManagePrivilegeMixedGrantOptionDowngradeOtherGrantee:
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: 'app_user|readonly_user'
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE users TO app_user, readonly_user WITH GRANT OPTION;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE users TO app_user, readonly_user;
    GRANT SELECT ON TABLE users TO app_user WITH GRANT OPTION;
  up: |
    REVOKE GRANT OPTION FOR SELECT ON TABLE public.users FROM "readonly_user";
  down: |
    GRANT SELECT ON TABLE public.users TO "readonly_user" WITH GRANT OPTION;

ManagePrivilegeOwnerConverge:
  # 宣言された owner が current と違えば ALTER OWNER が出る
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    ALTER TABLE users OWNER TO app_user;
  up: |
    ALTER TABLE users OWNER TO app_user;
  down: ""

ManagePrivilegeOwnerIdempotent:
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    ALTER TABLE users OWNER TO app_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    ALTER TABLE users OWNER TO app_user;
  up: ""
  down: ""

ManagePrivilegeOwnerUndeclaredUntouched:
  # desired に owner 宣言が無ければ、DB の所有者が誰でも触らない
  manage:
    privilege:
      - target: app_user
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    ALTER TABLE users OWNER TO app_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
  up: ""
  down: ""

ManagePrivilegeViewOwner:
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    CREATE VIEW v_users AS SELECT id FROM users;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    CREATE VIEW v_users AS SELECT id FROM users;
    ALTER TABLE v_users OWNER TO app_user;
  up: |
    ALTER TABLE v_users OWNER TO app_user;
  down: ""

ManagePrivilegeDropTableWithoutEnableDrop:
  # enable_drop: false only comments the DROP out, so the table survives and its
  # privileges stay revocable.
  enable_drop: false
  manage:
    privilege:
      - target: readonly_user
        drop: true
  current: |
    CREATE TABLE audit_logs (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE audit_logs TO readonly_user;
  desired: ""
  up: |
    -- Skipped: DROP TABLE "public"."audit_logs";
    REVOKE SELECT ON TABLE "public"."audit_logs" FROM "readonly_user";
  down: |
    GRANT SELECT ON TABLE "public"."audit_logs" TO "readonly_user";

ManagePrivilegeDropViewWithGrant:
  # A dropped view takes its privileges with it, so no REVOKE must be emitted
  # for it; the REVOKE would run after the DROP VIEW and fail with
  # "relation does not exist".
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE users (
      id bigint PRIMARY KEY,
      name varchar(100)
    );
    CREATE VIEW v_users AS SELECT id FROM users;
    GRANT SELECT ON TABLE v_users TO app_user;
  desired: |
    CREATE TABLE users (
      id bigint PRIMARY KEY,
      name varchar(100)
    );
  up: |
    DROP VIEW public.v_users;
  down: |
    CREATE VIEW v_users AS SELECT id FROM users;
    GRANT SELECT ON TABLE public.v_users TO "app_user";

ManagePrivilegeDropMaterializedViewWithGrant:
  # Same for a materialized view.
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE users (
      id bigint PRIMARY KEY,
      name varchar(100)
    );
    CREATE MATERIALIZED VIEW mv_users AS SELECT id FROM users;
    GRANT SELECT ON TABLE mv_users TO app_user;
  desired: |
    CREATE TABLE users (
      id bigint PRIMARY KEY,
      name varchar(100)
    );
  up: |
    DROP MATERIALIZED VIEW public.mv_users;
  down: |
    CREATE MATERIALIZED VIEW mv_users AS SELECT id FROM users;
    GRANT SELECT ON TABLE public.mv_users TO "app_user";

ManagePrivilegeRenameTable:
  # A rename carries the privileges over, so it produces no GRANT or REVOKE.
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE old_logs (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE old_logs TO app_user;
  desired: |
    CREATE TABLE new_logs ( -- @renamed from=old_logs
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE new_logs TO app_user;
  up: |
    ALTER TABLE public.old_logs RENAME TO new_logs;
  down: |
    CREATE TABLE old_logs (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE public.old_logs TO "app_user";
    DROP TABLE public.new_logs;

ManagePrivilegeRenameTableRevokeRemovedPrivilege:
  # A privilege dropped in the same run as the rename is revoked under the new
  # name, which is where the carried-over privilege now lives.
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE old_logs (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT, UPDATE ON TABLE old_logs TO app_user;
  desired: |
    CREATE TABLE new_logs ( -- @renamed from=old_logs
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT ON TABLE new_logs TO app_user;
  up: |
    ALTER TABLE public.old_logs RENAME TO new_logs;
    REVOKE UPDATE ON TABLE public.new_logs FROM "app_user";
  down: |
    CREATE TABLE old_logs (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT, UPDATE ON TABLE public.old_logs TO "app_user";
    DROP TABLE public.new_logs;

ManagePrivilegeRenameTableRevokeRemovedPrivilegeWithoutDrop:
  # The rule forbids REVOKE, so the privilege the rename carried over is reported
  # as skipped instead of being revoked.
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: app_user
  current: |
    CREATE TABLE old_logs (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT, UPDATE ON TABLE old_logs TO app_user;
  desired: |
    CREATE TABLE new_logs ( -- @renamed from=old_logs
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT ON TABLE new_logs TO app_user;
  up: |
    ALTER TABLE public.old_logs RENAME TO new_logs;
    -- Skipped: REVOKE UPDATE ON TABLE public.new_logs FROM "app_user";
  down: |
    CREATE TABLE old_logs (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT, UPDATE ON TABLE public.old_logs TO "app_user";
    DROP TABLE public.new_logs;

ManagePrivilegeRenameTableGrantAddedPrivilege:
  # Only the privilege added in the same run as the rename is granted.
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE old_logs (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE old_logs TO app_user;
  desired: |
    CREATE TABLE new_logs ( -- @renamed from=old_logs
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT ON TABLE new_logs TO app_user;
  up: |
    ALTER TABLE public.old_logs RENAME TO new_logs;
    GRANT INSERT ON TABLE public.new_logs TO "app_user";
  down: |
    CREATE TABLE old_logs (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT ON TABLE public.old_logs TO "app_user";
    DROP TABLE public.new_logs;

ManagePrivilegeRenameTableRevokeAllPrivileges:
  # The desired schema declares no grant for the renamed table, so the whole
  # carried-over privilege is revoked under the new name.
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE old_logs (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT ON TABLE old_logs TO app_user;
  desired: |
    CREATE TABLE new_logs ( -- @renamed from=old_logs
      id BIGINT PRIMARY KEY
    );
  up: |
    ALTER TABLE public.old_logs RENAME TO new_logs;
    REVOKE INSERT, SELECT ON TABLE public.new_logs FROM "app_user";
  down: |
    CREATE TABLE old_logs (
      id BIGINT PRIMARY KEY
    );
    GRANT SELECT, INSERT ON TABLE public.old_logs TO "app_user";
    DROP TABLE public.new_logs;

ManagePrivilegeRenameTableAndColumnOfColumnLevelGrant:
  # Renaming the table and the column of a column-level privilege in one run
  # leaves the privilege as it is, under both new names.
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE old_logs (
      id BIGINT PRIMARY KEY,
      secret TEXT
    );
    GRANT SELECT (secret) ON TABLE old_logs TO app_user;
  desired: |
    CREATE TABLE new_logs ( -- @renamed from=old_logs
      id BIGINT PRIMARY KEY,
      secret_v2 TEXT -- @renamed from=secret
    );
    GRANT SELECT (secret_v2) ON TABLE new_logs TO app_user;
  up: |
    ALTER TABLE public.old_logs RENAME TO new_logs;
    ALTER TABLE public.new_logs RENAME COLUMN secret TO secret_v2;
  down: |
    CREATE TABLE old_logs (
      id BIGINT PRIMARY KEY,
      secret TEXT
    );
    GRANT SELECT (secret) ON TABLE public.old_logs TO "app_user";
    DROP TABLE public.new_logs;

ManagePrivilegeRenameColumnAndRevokeColumnPrivilege:
  # A renamed column is renamed inside the privilege too: the surviving privilege
  # needs no DDL, and the dropped one is revoked under the new column name.
  # Revoking the old column name would fail with 42703.
  legacy_ignore_quotes: false
  manage:
    privilege:
      - target: app_user
        drop: true
  current: |
    CREATE TABLE logs (
      id BIGINT PRIMARY KEY,
      secret TEXT
    );
    GRANT SELECT (secret), UPDATE (secret) ON TABLE logs TO app_user;
  desired: |
