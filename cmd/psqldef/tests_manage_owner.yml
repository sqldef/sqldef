# yaml-language-server: $schema=../../testutil/testcase.schema.json
# Tests for manage.owner (see object-management.md): whether ALTER TABLE ... OWNER TO is
# diffed at all, and which owner roles are in scope.

ManageOwnerConverge:
  legacy_ignore_quotes: false
  manage:
    owner:
      - target: app_user
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    ALTER TABLE users OWNER TO app_user;
  up: |
    ALTER TABLE users OWNER TO app_user;
  down: ""

ManageOwnerIdempotent:
  legacy_ignore_quotes: false
  manage:
    owner:
      - target: app_user
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    ALTER TABLE users OWNER TO app_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    ALTER TABLE users OWNER TO app_user;
  up: ""
  down: ""

