ManageOwnerOnViewCreatedInTheSameRun:
  legacy_ignore_quotes: false
  manage:
    owner:
      - target: app_user
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    CREATE VIEW v_users AS SELECT id FROM users;
    ALTER TABLE v_users OWNER TO app_user;
  up: |
    CREATE VIEW v_users AS SELECT id FROM users;
    ALTER TABLE v_users OWNER TO app_user;
  down: |
    DROP VIEW public.v_users;

ManageOwnerSurvivesViewRecreate:
  legacy_ignore_quotes: false
  manage:
    owner:
      - target: app_user
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    CREATE VIEW v_users AS SELECT id, name FROM users;
    ALTER TABLE v_users OWNER TO app_user;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    CREATE VIEW v_users AS SELECT id FROM users;
    ALTER TABLE v_users OWNER TO app_user;
  up: |
    DROP VIEW public.v_users;
    CREATE VIEW public.v_users AS select id from users;
    ALTER TABLE v_users OWNER TO app_user;
  down: |
    CREATE OR REPLACE VIEW public.v_users AS select id, name from users;

ManageOwnerOnPartitionedTable:
  legacy_ignore_quotes: false
  manage:
    owner:
      - target: app_user
  current: |
    CREATE TABLE logs (
      id BIGINT NOT NULL,
      created_at DATE NOT NULL
    ) PARTITION BY RANGE (created_at);
    CREATE TABLE logs_2024 PARTITION OF logs FOR VALUES FROM ('2024-01-01') TO ('2025-01-01');
  desired: |
    CREATE TABLE logs (
      id BIGINT NOT NULL,
      created_at DATE NOT NULL
    ) PARTITION BY RANGE (created_at);
    CREATE TABLE logs_2024 PARTITION OF logs FOR VALUES FROM ('2024-01-01') TO ('2025-01-01');
    ALTER TABLE logs OWNER TO app_user;
  up: |
    ALTER TABLE logs OWNER TO app_user;
  down: ""

