ManageOwnerOnView:
  legacy_ignore_quotes: false
  manage:
    owner:
      - target: app_user
  current: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    CREATE VIEW v_users AS SELECT id FROM users;
  desired: |
    CREATE TABLE users (
      id BIGINT PRIMARY KEY,
      name VARCHAR(100)
    );
    CREATE VIEW v_users AS SELECT id FROM users;
    ALTER TABLE v_users OWNER TO app_user;
  up: |
    ALTER TABLE v_users OWNER TO app_user;
  down: ""

