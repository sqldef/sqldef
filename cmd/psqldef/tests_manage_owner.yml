    DROP VIEW public.v_base;
    CREATE VIEW public.v_base AS select id from users;
    ALTER VIEW public.v_base OWNER TO "app_user";
    CREATE MATERIALIZED VIEW public.mv_dep AS select id from v_base WITH NO DATA;
    ALTER MATERIALIZED VIEW public.mv_dep OWNER TO "app_user";
    GRANT SELECT ON TABLE public.mv_dep TO "readonly_user";
