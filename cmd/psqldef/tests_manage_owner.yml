    ALTER TABLE logs_2024 OWNER TO admin_role;
    ALTER TABLE logs_2025 OWNER TO admin_role;
  up: |
    ALTER TABLE logs OWNER TO admin_role;
    ALTER TABLE logs_2024 OWNER TO admin_role;
  down: |
